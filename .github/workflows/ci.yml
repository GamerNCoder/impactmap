name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholder values: the build only needs these to be present.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  database-and-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Language profile audit
        run: npm run audit:languages

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start local Supabase
        run: |
          supabase start --yes
          supabase db reset --yes

      - name: Write the test environment
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
            printf 'NEXT_PUBLIC_DEMO_ENABLED=true\n'
            printf 'DEMO_STUDENT_PASSWORD=ci-student-password\n'
            printf 'DEMO_ORGANIZER_PASSWORD=ci-organizer-password\n'
          } > .env.local

      - name: Database and security tests
        run: npm run test:db

      - name: Seed the demo accounts
        run: npm run seed:demo

      - name: Install the Chromium used by the accessibility test
        run: npx playwright install --with-deps chromium

      - name: Start the app for the accessibility test
        run: |
          npm run dev > /tmp/next-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "dev server did not start"
          cat /tmp/next-dev.log
          exit 1

      - name: Defense audit (grants, privacy, impact RPC, reset origin, headers)
        run: |
          set -a
          source /tmp/supabase.env
          set +a
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" BASE_URL=http://localhost:3000 npm run audit:defenses

      - name: Accessibility test (WCAG 2.2 A/AA, serious/critical)
        run: npm run test:a11y

      - name: UI walkthrough (health + full loop + bulk + auth gate)
        run: npm run test:ui

      - name: Theme toggle and dark map test
        run: npm run test:theme

      - name: Show the dev server log on failure
        if: failure()
        run: cat /tmp/next-dev.log
